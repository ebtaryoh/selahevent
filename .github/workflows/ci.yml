name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Refresh non-breaking dependency fixes
        run: npm audit fix --package-lock-only || true

      - name: Persist dependency lockfile updates
        run: |
          if git diff --quiet package-lock.json package.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "chore: refresh patched dependency lockfile"
          git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --audit-level=high
